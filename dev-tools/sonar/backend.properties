sonar.projectKey=manutencao-conectada-backend
sonar.projectName=Manutencao Conectada - Backend
sonar.projectVersion=1.0

sonar.sources=backend/src
sonar.tests=backend/tests,backend/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/migrations/**,**/coverage/**,**/*.spec.ts,**/*.test.ts
