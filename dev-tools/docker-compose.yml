services:
  sonarqube:
    image: sonarqube:community
    container_name: manutencao-conectada-sonarqube
    environment:
      SONAR_ES_BOOTSTRAP_CHECKS_DISABLE: "true"
    ports:
      - "9000:9000"
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_extensions:/opt/sonarqube/extensions
  beef:
    image: ilyaglow/beef
    container_name: manutencao-conectada-beef
    environment:
      BEEF_USER: beef
      BEEF_PASSWORD: ${BEEF_PASS:?defina BEEF_PASS em dev-tools/.env (rode scripts/beef-setup.sh)}
    ports:
      - "3000:3000"
      - "6789:6789"
      - "61985:61985"
      - "61986:61986"

volumes:
  sonar_data:
  sonar_logs:
  sonar_extensions:
